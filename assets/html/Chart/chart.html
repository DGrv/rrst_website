<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
<title>race|result chart</title>
<!-- rrst_Charts v1.13.0 - 2026-10-23 -->
<script src="./vendor/chart.umd.js"></script>
<style>
  /* Theme tokens. Values are stamped onto :root by applyTheme() so the chart
     chrome and the canvas read the same roles. Dark is the Presenter default. */
  :root {
    --surface:        transparent;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; background: var(--surface);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
  }
  #wrap { position: relative; height: 100%; width: 100%; box-sizing: border-box; padding: 10px 14px 24px 10px; }
  #chart { display: block; }
  #stamp {
    position: absolute; right: 10px; bottom: 6px;
    font-size: 11px; color: var(--text-muted);
    font-variant-numeric: tabular-nums; pointer-events: none;
  }
  #card {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; padding: 24px;
    box-sizing: border-box;
  }
  #card.show { display: flex; }
  #card-inner {
    max-width: 880px; max-height: 100%; overflow: auto;
    padding: 20px 24px 22px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    box-shadow: var(--card-shadow);
    /* monospace so the aligned columns of the help text stay aligned */
    font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    font-size: 12px; line-height: 1.5; color: var(--text-secondary);
    white-space: pre-wrap; text-align: left;
    scrollbar-width: thin;
    scrollbar-color: var(--scroll-thumb) transparent;
  }
  /* Blink/WebKit ignore scrollbar-color, so spell the same thing out: a thin
     thumb floating on the card, no track, no arrow buttons. */
  #card-inner::-webkit-scrollbar { width: 11px; height: 11px; }
  #card-inner::-webkit-scrollbar-track { background: transparent; }
  #card-inner::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb);
    border-radius: 999px;
    border: 3px solid transparent;
    background-clip: content-box;
  }
  #card-inner::-webkit-scrollbar-thumb:hover {
    background: var(--scroll-thumb-hover);
    background-clip: content-box;
  }
  #card-inner::-webkit-scrollbar-corner { background: transparent; }
  #card-inner.center {
    text-align: center; white-space: pre-wrap; font-size: 14px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #card-inner .title {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; font-weight: 600; color: var(--text-primary);
  }
  #card-inner h2 {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 13px; font-weight: 600; color: var(--text-primary);
    margin: 20px 0 12px; padding-top: 16px;
    border-top: 1px solid var(--card-border);
  }
  #card-inner .title + h2 { border-top: 0; padding-top: 10px; margin-top: 10px; }
  .note { margin: 0 0 18px; }
  .note > div { margin: 0 0 8px; }
  .note .demolink a { color: var(--series-1); text-decoration: none; word-break: break-all; }
  .note .demolink a:hover { text-decoration: underline; }
  .note .snippet {
    background: var(--snippet-bg);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 10px 12px;
    white-space: pre-wrap;
    word-break: break-all;
    cursor: text;
    color: var(--text-primary);
  }
  .note .shape {
    color: var(--text-muted); opacity: .8; word-break: break-all;
    border-left: 2px solid var(--gridline); padding-left: 10px;
  }
  .ex { margin: 0 0 14px; display: flex; gap: 12px; align-items: flex-start; }
  .exbody { min-width: 0; flex: 1; }
  .exshot {
    width: 200px; height: auto; display: block; flex: 0 0 auto;
    border: 1px solid var(--gridline); border-radius: 3px;
    background: #1a1a19; cursor: zoom-in;
  }
  .exshot:hover { border-color: var(--series-1); }
  #zoom {
    position: fixed; inset: 0; z-index: 10; display: none;
    background: rgba(0, 0, 0, .96); padding: 28px; box-sizing: border-box;
    flex-direction: column; cursor: zoom-out;
  }
  #zoom.show { display: flex; }
  #zoom .bar {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 12px; color: var(--text-muted); flex: 0 0 auto;
    padding-bottom: 8px; display: flex; justify-content: space-between; gap: 16px;
  }
  #zoom .bar b { color: var(--text-primary); font-weight: 600; }
  #zoom .bar .cap { margin-left: 10px; }
  #zoom .stage { flex: 1 1 auto; min-height: 0; display: flex; }
  #zoom iframe { width: 100%; height: 100%; border: 0; background: #1a1a19; border-radius: 4px; }
  #zoom img { margin: auto; max-width: 100%; max-height: 100%; image-rendering: auto; border-radius: 4px; }
  .ex .t { color: var(--series-1); text-decoration: none; font-weight: 600; }
  .ex a.t:hover { text-decoration: underline; }
  .ex .c {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-muted); margin: 1px 0 2px;
  }
  .ex .u { color: var(--text-secondary); opacity: .75; word-break: break-all; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="chart"></canvas>
  <div id="stamp"></div>
  <div id="card"><div id="card-inner"></div></div>
  <div id="zoom"><div class="bar"></div><div class="stage"></div></div>
</div>

  function getUrlParameter(name) {

    return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));

      var negate = val.charAt(0) === '!';
      if (negate) val = val.slice(1);
      if (!byCol[col]) byCol[col] = { yes: [], no: [] };
      byCol[col][negate ? 'no' : 'yes'].push(val.toLowerCase());
    }
    return byCol;
  }

  /* Clauses on the same column are OR-ed; different columns are AND-ed. */
  function passesWhere(row, byCol) {
    for (var col in byCol) {
      var raw = row[col];
      var v = String(raw === null || raw === undefined ? '' : raw).toLowerCase();
      var rule = byCol[col];
      if (rule.no.length && rule.no.indexOf(v) !== -1) return false;
      if (rule.yes.length && rule.yes.indexOf(v) === -1) return false;
    }
    return true;
  }

  function fmtBinEdge(v) {
    return String(Math.round(v * 100) / 100);
  }

  function aggregate(rows, fields, c) {
    var xCol = resolveColumn(c.x, fields, 'x');
    if (!xCol) throw new DataError('Missing the required "x" parameter.', fields);
    var gCol = resolveColumn(c.group, fields, 'group');
    /* Order the categories by another column - e.g. chart ContestName but put
       the contests in Contest order rather than alphabetically. */
    var sortCol = resolveColumn(c.sortBy, fields, 'sortBy');

    if (c.cumulative && c.mode === 'stacked100') {
      throw new DataError('cumulative is not compatible with mode=stacked100 - a share of a running total is not meaningful.', fields);
    }
    if (c.cumulative && c.sort === 'count') c.sort = 'label';

    var aggKind = 'count', aggCol = null;
    if (c.agg && c.agg !== 'count') {
      var bits = c.agg.split(':');
      aggKind = bits[0].toLowerCase();
      if (['sum', 'avg', 'distinct'].indexOf(aggKind) === -1) {
        throw new DataError('Unknown agg "' + c.agg + '". Use count, sum:<col>, avg:<col> or distinct:<col>.', fields);
      }
      if (bits.length < 2) {
        throw new DataError('agg "' + aggKind + '" needs a column, e.g. ' + aggKind + ':2', fields);
      }
      aggCol = resolveColumn(bits.slice(1).join(':'), fields, 'agg');
    }

    var byCol = parseWhere(c.where, fields);
    var kept = [];
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (!passesWhere(row, byCol)) continue;
      if (c.dropEmpty && isBlank(row[xCol])) continue;
      kept.push(row);
    }

    /* Bucketing: numeric bins, or the raw value as a category. */
    var bucketOf, binOrder = null;
    if (c.bins > 0) {
      var nums = [];
      for (var b = 0; b < kept.length; b++) {
        var n = parseFloat(kept[b][xCol]);
        if (!isNaN(n)) nums.push(n);
      }
      if (!nums.length) throw new DataError('No numeric values in column "' + xCol + '" to bin.', fields);
      var lo = Math.min.apply(null, nums), hi = Math.max.apply(null, nums);
      var width = (hi - lo) / c.bins || 1;
      binOrder = [];
      for (var k = 0; k < c.bins; k++) {
        binOrder.push(fmtBinEdge(lo + k * width) + '-' + fmtBinEdge(lo + (k + 1) * width));
      }
      bucketOf = function (r) {
        var v = parseFloat(r[xCol]);
        if (isNaN(v)) return null;
        var idx = Math.floor((v - lo) / width);
        if (idx >= c.bins) idx = c.bins - 1;
        if (idx < 0) idx = 0;
        return binOrder[idx];
      };
    } else if (c.cumulative) {
      /* Daily buckets: a timestamp like "2026-10-12 12:34:29" collapses onto
         the same day as a plain "2026-10-12" date, so cumulative counts are
         per-day regardless of how much precision the export carries. */
      bucketOf = function (r) {
        if (isBlank(r[xCol])) return EMPTY_LABEL;
        var v = String(r[xCol]);
        return v.length > 10 ? v.slice(0, 10) : v;
      };
    } else {
      bucketOf = function (r) { return isBlank(r[xCol]) ? EMPTY_LABEL : String(r[xCol]); };
    }

    /* cells: xLabel -> seriesName -> accumulator */
    var cells = new Map(), xSeen = [], gTotals = new Map(), sortKeys = new Map();

    for (var m = 0; m < kept.length; m++) {
      var rec = kept[m];
      var xKey = bucketOf(rec);
      if (xKey === null) continue;
      var gKey = gCol ? (isBlank(rec[gCol]) ? EMPTY_LABEL : String(rec[gCol])) : '';

      if (!cells.has(xKey)) { cells.set(xKey, new Map()); xSeen.push(xKey); }

      if (sortCol && !isBlank(rec[sortCol])) {
        /* a category takes the smallest sort value found among its rows */
        var sv = rec[sortCol];
        var seen = sortKeys.get(xKey);
        if (seen === undefined || valueCompare(sv, seen) < 0) sortKeys.set(xKey, sv);
      }
      var inner = cells.get(xKey);
      if (!inner.has(gKey)) inner.set(gKey, { n: 0, sum: 0, set: null });
      var acc = inner.get(gKey);

      var weight = 1;
      if (aggKind === 'count') {
        acc.n += 1;
      } else if (aggKind === 'distinct') {
        if (!acc.set) acc.set = new Set();
        acc.set.add(String(rec[aggCol]));
      } else {
        var val = parseFloat(rec[aggCol]);
        if (!isNaN(val)) { acc.sum += val; acc.n += 1; }
        weight = isNaN(val) ? 0 : val;
      }
      /* Series order is by magnitude; for distinct, by record count. */
      gTotals.set(gKey, (gTotals.get(gKey) || 0) + weight);
    }

    function readCell(acc) {
      if (!acc) return 0;
      if (aggKind === 'count') return acc.n;
      if (aggKind === 'distinct') return acc.set ? acc.set.size : 0;
      if (aggKind === 'sum') return acc.sum;
      return acc.n ? acc.sum / acc.n : 0;   /* avg */
    }

    function totalOf(label) {
      var t = 0;
      cells.get(label).forEach(function (acc) { t += readCell(acc); });
      return t;
    }

    /* Series order: descending total, capped at MAX_SERIES with an Other fold. */
    var seriesNames = Array.from(gTotals.keys()).sort(function (a, b) {
      var d = (gTotals.get(b) || 0) - (gTotals.get(a) || 0);
      return d !== 0 ? d : naturalCompare(a, b);
    });
    var folded = null;
    if (seriesNames.length > MAX_SERIES) {
      folded = seriesNames.slice(MAX_SERIES - 1);
      seriesNames = seriesNames.slice(0, MAX_SERIES - 1).concat([OTHER_LABEL]);
    }

    /* Label order. */
    var labels;
    if (binOrder) {
      labels = binOrder.filter(function (l) { return cells.has(l); });
    } else if (sortCol) {
      /* sortBy wins over sort=; categories with no value go last */
      labels = xSeen.slice().sort(function (a, b) {
        var va = sortKeys.get(a), vb = sortKeys.get(b);
        if (va === undefined && vb === undefined) return naturalCompare(a, b);
        if (va === undefined) return 1;
        if (vb === undefined) return -1;
        return valueCompare(va, vb) || naturalCompare(a, b);
      });
    } else if (c.sort === 'count') {
      labels = xSeen.slice().sort(function (a, b) {
        return (totalOf(b) - totalOf(a)) || naturalCompare(a, b);
      });
    } else if (c.sort === 'none') {
      labels = xSeen.slice();
    } else {
      labels = xSeen.slice().sort(naturalCompare);
    }

    /* top=N on categories, remainder folded into Other. */
    if (c.top > 0 && labels.length > c.top) {
      var byTotal = labels.slice().sort(function (a, b) { return totalOf(b) - totalOf(a); });
      var keep = Object.create(null);
      byTotal.slice(0, c.top).forEach(function (l) { keep[l] = 1; });
      var rest = labels.filter(function (l) { return !keep[l]; });
      labels = labels.filter(function (l) { return keep[l]; });
      if (rest.length) {
        var merged = new Map();
        rest.forEach(function (l) {
          cells.get(l).forEach(function (acc, g) {
            if (!merged.has(g)) merged.set(g, { n: 0, sum: 0, set: null });
            var t = merged.get(g);
            t.n += acc.n;
            t.sum += acc.sum;
            if (acc.set) {
              if (!t.set) t.set = new Set();
              acc.set.forEach(function (v) { t.set.add(v); });
            }
          });
        });
        cells.set(OTHER_LABEL, merged);
        labels.push(OTHER_LABEL);
      }
    }

    var series = seriesNames.map(function (name) {
      var sources = (name === OTHER_LABEL && folded) ? folded : [name];
      return {
        name: name,
        isOther: name === OTHER_LABEL && !!folded,
        values: labels.map(function (l) {
          var inner = cells.get(l);
          var v = 0;
          for (var s = 0; s < sources.length; s++) v += readCell(inner.get(sources[s]));
          return Math.round(v * 1000) / 1000;
        })
      };
    });

    /* Cumulative: running total in label (chronological) order, per series
       independently - one contest's daily count never leaks into another's. */
    if (c.cumulative) {
      series.forEach(function (s) {
        for (var ci = 1; ci < s.values.length; ci++) s.values[ci] += s.values[ci - 1];
      });
    }

    /* Keep the unscaled numbers next to the plotted ones: stacked100 plots a
       share, but "28% of what?" is the next question, so the labels can show
       the count and the column total too. */
    series.forEach(function (s) { s.raw = s.values.slice(); });
    var columnTotals = labels.map(function (ignored, col) {
      var t = 0;
      for (var s1 = 0; s1 < series.length; s1++) t += series[s1].raw[col];
      return Math.round(t * 1000) / 1000;
    });

    if (c.mode === 'stacked100') {
      for (var col = 0; col < labels.length; col++) {
        var tot = columnTotals[col];
        if (tot > 0) {
          for (var s2 = 0; s2 < series.length; s2++) {
            series[s2].values[col] = Math.round(series[s2].raw[col] / tot * 1000) / 10;
          }
        }
      }
    }

    /* strip is a display transform only - the underlying keys are untouched. */
    var displayLabels = labels.map(function (l) {
      if (!c.strip) return l;
      return l.split(c.strip).join('').trim() || l;
    });

    /* A plain date x column ("2026-01-14") can be plotted on a real numeric
       axis instead of one evenly-spaced tick per category, so gaps (days with
       no registrations) show as gaps rather than being hidden. A date-prefixed
       hour slot ("2026-10-17 17:00-18:00") is date-*like* - enough to thin out
       crowded tick labels - but collapsing it to a day-offset would merge
       every hour of the same day onto one x position, so it keeps the plain
       categorical axis and only inherits the auto-skip. */
    var DATE_RE = /^\d{4}-\d{2}-\d{2}/;
    var DATE_ONLY_RE = /^\d{4}-\d{2}-\d{2}$/;
    var isDateLike = !binOrder && labels.length > 0 &&
      labels.every(function (l) { return DATE_RE.test(l); });
    var isTimeAxis = isDateLike &&
      labels.every(function (l) { return DATE_ONLY_RE.test(l); });

    var dayOffsets = null;
    if (isTimeAxis) {
      var eventEpochDay = null;
      if (c.eventDate && DATE_RE.test(c.eventDate)) {
        var edMs = Date.parse(c.eventDate.slice(0, 10) + 'T00:00:00Z');
        if (!isNaN(edMs)) eventEpochDay = Math.floor(edMs / 86400000);
      }
      dayOffsets = labels.map(function (l) {
        var ms = Date.parse(l.slice(0, 10) + 'T00:00:00Z');
        var day = Math.floor(ms / 86400000);
        return eventEpochDay !== null ? day - eventEpochDay : day;
      });
    }

    return {
      labels: labels,
      displayLabels: displayLabels,
      series: series,
      columnTotals: columnTotals,
      rowsKept: kept.length,
      xCol: xCol,
      gCol: gCol,
      aggKind: aggKind,
      aggCol: aggCol,
      isTimeAxis: isTimeAxis,
      isDateLike: isDateLike,
      dayOffsets: dayOffsets
    };
  }

  /* This page's own address, without any query - what an iframe elsewhere

  function pageUrl() {

      ? location.origin + location.pathname
      : location.href.split('?')[0];
  }

  /* How the examples should name this page's data source. */
  function sourceQuery() {
    if (cfg.event && cfg.key) {
      return 'event=' + encodeURIComponent(cfg.event) + '&key=' + encodeURIComponent(cfg.key);
    }
    if (cfg.url) return 'url=' + encodeURIComponent(cfg.url);
    return null;
  }

  function hideCard() {
    cardEl.classList.remove('show');
    canvasEl.style.visibility = 'visible';
  }

  /* Colour follows the entity: a series keeps its slot for the life of the
     page even if a later poll reorders the totals. */
  var slotOf = Object.create(null);
  var nextSlot = 0;
  function colorFor(s) {
    if (s.isOther) return OTHER_COLOR;
    if (!(s.name in slotOf)) {
      slotOf[s.name] = nextSlot < theme.series.length ? nextSlot++ : -1;
    }
    var i = slotOf[s.name];
    return i === -1 ? OTHER_COLOR : theme.series[i];
  }

  function fmtNumber(v) {
    return Number.isInteger(v) ? String(v) : String(Math.round(v * 100) / 100);
  }

  /* A time-axis dataset holds {x, y} points instead of plain numbers. */
  function yOf(v) {
    return (v && typeof v === 'object') ? v.y : v;
  }

  /* On a stacked100 chart the plotted value is a share, so by default the
     label carries both: the percentage and the count it came from, over the
     column total. values=pct or values=count narrow it to one of the two. */
  function labelText(ds, i) {
    var v = yOf(ds.data[i]);
    if (cfg.mode !== 'stacked100') return fmtNumber(v);

    var pct = (Math.round(v * 10) / 10) + '%';
    if (cfg.values === 'pct') return pct;

    var raw = ds.raw ? ds.raw[i] : null;
    var tot = ds.totals ? ds.totals[i] : null;
    if (raw === null || tot === null || tot === undefined) return pct;

    var counts = fmtNumber(raw) + '/' + fmtNumber(tot);
    return cfg.values === 'count' ? counts : pct + '  ' + counts;
  }

  /* The one tooltip row, for the segment under the pointer. The drawn labels
     are narrowed by values= and dropped whenever a bar is too thin to hold
     them - common in a small iframe - so the tooltip always carries the full
     numbers: the plotted value, the count behind it, its share of the column. */
  function tipLabel(item) {
    var ds = item.dataset;
    var i = item.dataIndex;
    var multi = item.chart.data.datasets.length > 1;
    var tot = ds.totals ? ds.totals[i] : null;
    var raw = ds.raw ? ds.raw[i] : yOf(ds.data[i]);
    var head = ds.label ? ds.label + ': ' : '';

    if (cfg.mode === 'stacked100') {
      var out = (Math.round(yOf(ds.data[i]) * 10) / 10) + '%';
      if (tot) out += '  (' + fmtNumber(raw) + '/' + fmtNumber(tot) + ')';
      return head + out;
    }
    var txt = fmtNumber(raw);
    if (multi && tot) txt += '  (' + (Math.round(raw / tot * 1000) / 10) + '%)';
    return head + txt;
  }

  /* Numbers on the bars. Auto-enables only for a grouped chart with few
     series and bars wide enough to hold a label. */
  var valueLabels = {
    id: 'rrstValueLabels',
    defaults: { mode: 'auto', horizontal: false, stacked: false, color: '#c3c2b7', size: 13 },
    afterDatasetsDraw: function (chart, args, opts) {
      if (opts.mode === 'off') return;
      var sets = chart.data.datasets;
      if (!sets.length) return;
      if (opts.mode === 'auto') {
        if (opts.stacked || sets.length > 4) return;
        var probe = chart.getDatasetMeta(0).data[0];
        if (!probe) return;
        var thickness = opts.horizontal ? probe.height : probe.width;
        if (!thickness || thickness < 22) return;
      }
      var ctx = chart.ctx;
      ctx.save();
      ctx.font = opts.size + 'px ' + FONT;
      for (var di = 0; di < sets.length; di++) {
        var meta = chart.getDatasetMeta(di);
        if (meta.hidden) continue;
        for (var i = 0; i < meta.data.length; i++) {
          var v = yOf(sets[di].data[i]);
          if (!v) continue;
          var el = meta.data[i];
          var text = labelText(sets[di], i);

          if (opts.stacked) {
            /* Inside a filled segment: centre it, skip it when the segment is
               too small to hold it, and outline it so it stays legible on any
               series colour. */
            var span = opts.horizontal ? Math.abs(el.x - el.base) : Math.abs(el.base - el.y);
            var need = opts.horizontal ? ctx.measureText(text).width + 12 : opts.size + 8;
            if (!(span >= need)) continue;
            var cx = opts.horizontal ? (el.base + el.x) / 2 : el.x;
            var cy = opts.horizontal ? el.y : (el.base + el.y) / 2;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = 'rgba(0, 0, 0, .55)';
            ctx.strokeText(text, cx, cy);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(text, cx, cy);
            continue;
          }

          ctx.fillStyle = opts.color;
          if (opts.horizontal) {
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.fillText(text, el.x + 6, el.y);
          } else {
            ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
            ctx.fillText(text, el.x, el.y - 4);
          }
        }
      }
      ctx.restore();
    }
  };

  function autoTitle(agg) {
    if (cfg.title) return cfg.title;
    var what = agg.aggKind === 'count'
      ? 'Count'
      : agg.aggKind.charAt(0).toUpperCase() + agg.aggKind.slice(1) + ' of ' + agg.aggCol;
    if (cfg.cumulative) what = 'Cumulative ' + what;
    var t = what + ' by ' + agg.xCol;
    if (agg.gCol) t += ', by ' + agg.gCol;
    return t;
  }

  function valueAxisTitle(agg) {
    if (cfg.ylab !== '') return cfg.ylab;
    if (cfg.mode === 'stacked100') return 'Share (%)';
    if (agg.aggKind === 'count') return cfg.cumulative ? 'Cumulative count' : 'Count';
    return (cfg.cumulative ? 'Cumulative ' : '') + agg.aggKind + ' of ' + agg.aggCol;
  }

  function buildDatasets(agg) {
    return agg.series.map(function (s) {
      var c = colorFor(s);
      var data = agg.isTimeAxis
        ? s.values.map(function (v, i) { return { x: agg.dayOffsets[i], y: v }; })
        : s.values;
      var base = {
        label: s.name === '' ? (cfg.ylab || 'Total') : s.name,
        data: data,
        /* not used by Chart.js - read back by the value-label plugin */
        raw: s.raw,
        totals: agg.columnTotals,
        backgroundColor: c
      };
      if (cfg.cumulative) {
        base.borderColor = c;
        base.fill = false;
        base.tension = 0;
        base.pointRadius = 2;
        base.borderWidth = 2;
        return base;
      }
      /* On the light surface, aqua and yellow sit below 3:1 contrast, so
         every bar carries a hairline edge to stay visible. The dark steps
         clear 3:1 and need none. */
      base.borderColor = cfg.theme === 'light' ? theme.baseline : c;
      base.borderWidth = cfg.theme === 'light' ? 1 : 0;
      base.borderRadius = 4;
      base.borderSkipped = 'start';
      /* leaves a thin strip of surface between neighbouring bars */
      base.barPercentage = 0.9;
      base.categoryPercentage = 0.82;
      return base;
    });
  }

  function render(agg) {
    hideCard();
    var timeMode = agg.isTimeAxis;
    var noHorizontal = cfg.cumulative || timeMode;
    var stacked = !cfg.cumulative && (cfg.mode === 'stacked' || cfg.mode === 'stacked100');
    var multi = agg.series.length > 1;
    var legendPos = cfg.legend === 'auto' ? (multi ? 'top' : 'none') : cfg.legend;
    var datasets = buildDatasets(agg);

    if (chart) {
      chart.data.labels = timeMode ? undefined : agg.displayLabels;
      chart.data.datasets = datasets;
      chart.options.plugins.legend.display = legendPos !== 'none';
      if (legendPos !== 'none') chart.options.plugins.legend.position = legendPos;
      chart.options.plugins.title.text = autoTitle(agg);
      chart.update('none');
      return;
    }

    /* A date x column gets a real numeric axis instead of one evenly-spaced
       tick per category, so gaps between registration days are proportional
       rather than hidden; EventDate relabels it as days before/after that
       date. Chart.js auto-skips crowded ticks on a linear scale, unlike the
       categorical axis below which always shows every label. */
    var catAxis = timeMode ? {
      type: 'linear',
      stacked: stacked,
      grid: { display: false },
      border: { color: theme.baseline },
      ticks: {
        color: theme.textSecondary,
        font: { family: FONT, size: BASE_SIZE },
        precision: 0,
        callback: function (value) {
          if (cfg.eventDate) return value === 0 ? 'Event' : (value > 0 ? '+' : '') + value;
          return new Date(value * 86400000).toISOString().slice(0, 10);
        }
      }
    } : {
      stacked: stacked,
      grid: { display: false },
      border: { color: theme.baseline },
      ticks: {
        color: theme.textSecondary,
        font: { family: FONT, size: BASE_SIZE },
        /* a date-prefixed hour slot is crowded with one tick per bucket - let
           Chart.js thin those out; a plain category column keeps every label. */
        autoSkip: agg.isDateLike,
        maxRotation: (cfg.horizontal && !noHorizontal) ? 0 : 60,
        minRotation: 0
      }
    };
    if (cfg.xlab) {
      catAxis.title = {
        display: true, text: cfg.xlab, color: theme.textSecondary,
        font: { family: FONT, size: BASE_SIZE }
      };
    }

    var valAxis = {
      stacked: stacked,
      beginAtZero: true,
      grid: { color: theme.gridline, tickLength: 0 },
      border: { display: false },
      ticks: {
        color: theme.textMuted,
        font: { family: FONT, size: Math.max(10, BASE_SIZE - 2) },
        padding: 8
      }
    };
    var vTitle = valueAxisTitle(agg);
    if (vTitle) {
      valAxis.title = {
        display: true, text: vTitle, color: theme.textSecondary,
        font: { family: FONT, size: BASE_SIZE }
      };
    }
    if (cfg.max !== null) valAxis.max = cfg.max;
    if (cfg.mode === 'stacked100') valAxis.max = 100;

    chart = new Chart(canvasEl, {
      type: cfg.cumulative ? 'line' : 'bar',
      plugins: [valueLabels],
      data: { labels: timeMode ? undefined : agg.displayLabels, datasets: datasets },
      options: {
        animation: false,
        responsive: true,
        maintainAspectRatio: false,
        indexAxis: (cfg.horizontal && !noHorizontal) ? 'y' : 'x',
        layout: { padding: { top: 6, right: 18, bottom: 0, left: 0 } },
        scales: (cfg.horizontal && !noHorizontal) ? { y: catAxis, x: valAxis } : { x: catAxis, y: valAxis },
        plugins: {
          legend: {
            display: legendPos !== 'none',
            position: legendPos === 'none' ? 'top' : legendPos,
            labels: {
              color: theme.textPrimary,
              font: { family: FONT, size: BASE_SIZE },
              boxWidth: 12, boxHeight: 12,
              usePointStyle: true, pointStyle: 'rectRounded',
              padding: 14
            }
          },
          title: {
            display: true,
            text: autoTitle(agg),
            color: theme.textPrimary,
            font: { family: FONT, size: Math.round(22 * cfg.scale), weight: '600' },
            padding: { top: 2, bottom: 14 }
          },
          /* A Presenter screen has no pointer, but an embedded iframe is often
             too small for the on-bar labels, so hover carries the numbers.
             tooltip=0 restores the label-only behaviour. */
          tooltip: {
            enabled: cfg.tooltip,
            /* one row: the segment under the pointer, nothing else */
            mode: 'nearest',
            intersect: true,
            position: 'nearest',
            backgroundColor: theme.cardBg,
            borderColor: theme.cardBorder,
            borderWidth: 1,
            titleColor: theme.textPrimary,
            bodyColor: theme.textSecondary,
            titleFont: { family: FONT, size: BASE_SIZE, weight: '600' },
            bodyFont: { family: FONT, size: BASE_SIZE },
            padding: 10,
            boxPadding: 4,
            usePointStyle: true,
            callbacks: {
              /* a rounded chip, to match the legend swatch */
              labelPointStyle: function () {
                return { pointStyle: 'rectRounded', rotation: 0 };
              },
              label: tipLabel
            }
          },
          rrstValueLabels: {
            /* point-label geometry on a 30+ day line isn't useful, and the
               plugin's math assumes bar elements (el.x/el.base). */
            mode: cfg.cumulative ? 'off' : cfg.values,
            horizontal: cfg.horizontal && !noHorizontal,
            stacked: stacked,
            color: theme.textSecondary,
            size: Math.max(10, BASE_SIZE - 3)
          }
        }
      }
    });
  }

  /* ------------------------------------------------------------------ *
   * 7. Load loop                                                        *
   * ------------------------------------------------------------------ */

  var HELP = [
    'Required',
    '  event         the race|result event id, e.g. 376732',
    '  key           the key of an API binding that returns JSON',
    '                 together they must form a working link, e.g.',
    '                 https://api.raceresult.com/376732/<KEY>',
    '  x             column for the x axis: field name or 0-based index',
    '',
    '  (or url=<full endpoint, URL-encoded> instead of event+key)',
    '',
    'Optional',
    '  group         column to dodge / stack by (omit for one series)',
    '  agg=count     count | sum:<col> | avg:<col> | distinct:<col>',
    '  mode=grouped  grouped | stacked | stacked100',
    '  horizontal=0  1 for horizontal bars',
    '  bins=<n>      treat x as numeric, bin into n equal-width bins',
    '  where=<col>:<value>   filter, repeatable; prefix the value with ! to negate',
    '  dropEmpty=1   drop records with a blank x value',
    '  sort=label    label | count | none',
    '  sortBy=<col>  order the categories by another column, e.g. sortBy=Contest',
    '  top=<n>       keep the n largest categories, fold the rest into Other',
    '  strip=<text>  literal text removed from every x label',
    '  title=  xlab=  ylab=   text overrides',
    '  legend=auto   top | bottom | right | none',
    '  theme=dark    light | dark',
    '  bg=           background colour, e.g. bg=%23101418 (default transparent)',
    '  refresh=300   poll seconds (5 min), 0 disables',
    '  max=<n>       fix the value-axis maximum',
    '  tooltip=1     0 turns the hover popup off',
    '  values=auto   on | off | pct | count - numbers drawn on the bars',
    '                 stacked100 shows "28%  104/162" unless narrowed',
    '  scale=1       font size multiplier',
    '  cumulative=0  1 plots a running total over x, as a line',
    '                 (not compatible with mode=stacked100)',
    '  EventDate=    a date, e.g. 2026-10-18; relabels a date x axis as',
    '                 days before/after that date instead of the raw dates',
    '',
    'Example',
    '  ?event=376732&key=<KEY>&x=BibCollectedTimestamp&group=Contest',
    '',
    '  Cumulative registrations by contest, counting down to race day:',
    '  ?event=376732&key=<KEY>&x=CreatedAtGA&group=Contest.Name',
    '   &cumulative=1&EventDate=2026-10-18'
  ].join('\n');

  var lastSignature = null;
  var lastGood = null;

  function hhmm(d) {
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function describeError(err) {
    var msg = (err instanceof DataError)
      ? err.message
      : 'Could not load the data.\n' + ((err && err.message) ? err.message : String(err));
    if ((err instanceof DataError) && err.fields) {
      msg += '\n\nAvailable columns:\n' + err.fields.map(function (f, i) {
        return '  ' + i + '  ' + f;
      }).join('\n');
    }
    return msg;
  }

  function load(isPoll) {
    var href;
    try { href = checkHost(endpointUrl()); }
    catch (e) { showCard(describeError(e), true); return Promise.resolve(); }

    return fetch(href, { cache: 'default' })
      .then(function (res) {
        if (!res.ok) throw new DataError('HTTP ' + res.status + ' ' + res.statusText + '\n' + href);
        return res.json();
      })
      .then(function (data) {
        var rows = normaliseRows(data);
        if (!rows.length) throw new DataError('The endpoint returned no records.');
        var fields = fieldsOf(rows);
        var agg = aggregate(rows, fields, cfg);
        if (!agg.labels.length) throw new DataError('No records left after filtering.', fields);

        var sig = JSON.stringify([agg.displayLabels, agg.series.map(function (s) {
          return [s.name, s.values];
        })]);
        lastGood = new Date();
        stampEl.textContent = 'v' + VERSION + ' · updated ' + hhmm(lastGood);
        if (sig === lastSignature && chart) return;   /* unchanged - skip the redraw */
        lastSignature = sig;
        render(agg);
      })
      .catch(function (err) {
        /* Keep the last good chart on screen; a blank panel is worse than
           slightly old numbers. */
        if (isPoll && chart) {
          stampEl.textContent = 'v' + VERSION + ' · stale since ' + (lastGood ? hhmm(lastGood) : '?');
          return;
        }
        showCard(describeError(err), true);
      });
  }

  function boot() {
    var meta = document.createElement('meta');
    meta.setAttribute('name', 'version');
    meta.setAttribute('content', VERSION + ' (' + VERSION_DATE + ')');
    document.head.appendChild(meta);

    cardEl = document.getElementById('card');
    cardInner = document.getElementById('card-inner');
    stampEl = document.getElementById('stamp');
    canvasEl = document.getElementById('chart');
    zoomEl = document.getElementById('zoom');
    zoomEl.addEventListener('click', closeZoom);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeZoom();
    });
    applyTheme();

    var source = sourceQuery();
    if (!source) {
      showHelpCard(null);
    } else if (!cfg.x) {
      /* event+key but no chart asked for: offer the examples, already wired up
         to this event. Validate the pair first so a typo is reported instead. */
      try {
        endpointUrl();
        showHelpCard(source);
      } catch (e) {
        showCard(describeError(e), true);
      }
    } else {
      load(false);
      if (cfg.refresh > 0) {
        setInterval(function () { load(true); }, Math.max(5, cfg.refresh) * 1000);
      }
    }
  }

  /* Exposed so the aggregation can be exercised headlessly by test/run-tests.js */
  var api = {
    VERSION: VERSION,
    EXAMPLES: EXAMPLES,
    VERSION_DATE: VERSION_DATE,
    cfg: cfg,
    aggregate: aggregate,
    endpointUrl: endpointUrl,
    checkHost: checkHost,
    normaliseRows: normaliseRows,
    fieldsOf: fieldsOf,
    resolveColumn: resolveColumn,
    DataError: DataError
  };
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = api;
  } else {
    window.rrst = api;
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  }
})();
</script>
</body>
</html>
